name: Bug report
description: Report a reproducible defect
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not attach real secrets or private ciphertext. A minimal synthetic reproducer is enough.
  - type: input
    id: version
    attributes:
      label: AES-Breaker version
      placeholder: "2.0.0"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: Include the exact command, exit code, and relevant stderr.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, pycryptodome version, external tools.
    validations:
      required: true
